services:
  api:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    env_file:
      - ../../.env
    ports:
      - "8000:8000"
    environment:
      USE_CELERY: "true"
    command: uvicorn main:app --host 0.0.0.0 --port 8000

  worker:
    build:
      context: ../../
      dockerfile: infra/docker/Dockerfile
    env_file:
      - ../../.env
    environment:
      USE_CELERY: "true"
    command: celery -A infra.queue.celery_config.celery_app worker --loglevel=info
